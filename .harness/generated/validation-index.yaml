validate_commands:
  - go test ./...
  - go test -race ./pkg/wecom
  - go vet ./...
  - git diff --check

change_type_to_checks:
  crypto:
    - go test ./...
    - go test ./pkg/wecom -run TestCryptDoesNotLogMessagePlaintext
  downloaded_media_crypto:
    - go test ./...
  message_schema:
    - go test ./...
  longconn_commands:
    - go test ./...
    - go test -race ./pkg/wecom
  longconn_media_upload:
    - go test ./pkg/wecom -run 'TestLongConnUploadMedia|TestLongConnMediaUpload'
    - go test -race ./pkg/wecom
  config_defaults:
    - go test ./...
  example_echo:
    - go test ./...

ci_jobs: []

release_checks:
  - verify downstream IMBotCore adapter if exported contracts changed
  - review example/echo image decrypt path if image payload or msg_item helpers changed
  - verify IMBotCore and wechataibot builds if exported long-connection contracts changed

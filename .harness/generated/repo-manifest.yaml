repo_id: bot-protocol-wecom
role: WeCom protocol SDK
owns:
  - callback signature verification
  - message encryption and decryption
  - downloaded media decryption helpers
  - passive stream reply structures
  - long connection request / response runtime
  - long connection media replies and active pushes
  - long connection temporary media upload
not_owns:
  - command routing
  - product skills
  - deployment workflow
  - WeCom-hosted MCP or API-mode tools
entrypoints:
  - pkg/wecom/bot.go
  - pkg/wecom/longconn_bot.go
  - example/echo/main.go
depends_on:
  - github.com/gorilla/websocket
high_risk_areas:
  - pkg/wecom/crypt.go
  - pkg/wecom/message.go
  - pkg/wecom/longconn_bot.go
  - pkg/wecom/longconn_media.go
read_first:
  - AGENTS.md
  - README.md
  - .harness/README.md
  - .harness/generated/module-map.md
  - .harness/generated/contract-index.yaml
  - .harness/generated/validation-index.yaml
  - .harness/generated/api-index.md
  - .harness/architecture.md
base_branch: main
